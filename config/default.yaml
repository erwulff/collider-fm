data:
  dataset_name: CERN/ColliderML-Release-1
  dataset_type: ttbar
  pu_config: pu0
  object_types:
    - calo_hits
  cache_dir: /mnt/ceph/users/ewulff/data/hf
  dataset_revision: e28a24cc9c1641a478ae4e5bc3b376eb624b7283
  local_files_only: false

views:
  max_calo_hits:
  coord_noise_scale: 0.001
  energy_jitter_scale: 0.05
  phi_rotation_max: 3.141592653589793
  point_dropout: 0.05
  num_global_views: 2
  num_local_views: 4
  global_crop_min_ratio: 0.4
  global_crop_max_ratio: 1.0
  local_crop_min_ratio: 0.1
  local_crop_max_ratio: 0.4
  constrain_to_principal: true
  coord_center: [0, 0, 0]
  coord_scale: 5000.0
  energy_transform: log
  energy_min: 0.01
  energy_max: 20.0
  grid_sample_enabled: true
  grid_sample_size: 0.002

model:
  training:
    in_channels: 4
    grid_size: 0.002
    head_embed_channels: 256
    head_num_prototypes: 4096
    num_global_view: 2
    num_local_view: 4
    mask_size_start: 0.02
    mask_size_base: 0.15
    mask_size_warmup_ratio: 0.05
    mask_ratio_start: 0.5
    mask_ratio_base: 0.9
    mask_ratio_warmup_ratio: 0.05
    mask_jitter:
    mask_jitter_start: 0.0
    mask_jitter_base: 0.001
    mask_jitter_warmup_ratio: 0.05
    teacher_temp_start: 0.04
    teacher_temp_base: 0.07
    teacher_temp_warmup_ratio: 0.05
    student_temp: 0.1
    mask_loss_weight: 0.25
    roll_mask_loss_weight: 0.25
    unmask_loss_weight: 0.5
    momentum_base: 0.994
    momentum_final: 1.0
    match_max_r: 0.004
    up_cast_level: 2
    backbone:
      enc_depths: [1, 1, 2, 2, 1]
      enc_channels: [16, 32, 64, 96, 128]
      enc_num_head: [1, 2, 4, 4, 8]
      enc_patch_size: [48, 48, 48, 48, 48]
      shuffle_orders: false
      enable_flash: true
      drop_path: 0.3
      layer_scale: 0.00001
  diagnostics:
    in_channels: 4
    grid_size: 0.002
    head_embed_channels: 64
    head_num_prototypes: 32
    num_global_view: 2
    num_local_view: 4
    mask_size_start: 0.02
    mask_size_base: 0.15
    mask_size_warmup_ratio: 0.05
    mask_ratio_start: 0.5
    mask_ratio_base: 0.9
    mask_ratio_warmup_ratio: 0.05
    mask_jitter:
    mask_jitter_start: 0.0
    mask_jitter_base: 0.001
    mask_jitter_warmup_ratio: 0.05
    teacher_temp_start: 0.04
    teacher_temp_base: 0.07
    teacher_temp_warmup_ratio: 0.05
    student_temp: 0.1
    mask_loss_weight: 0.25
    roll_mask_loss_weight: 0.25
    unmask_loss_weight: 0.5
    momentum_base: 0.994
    momentum_final: 1.0
    match_max_r: 0.004
    up_cast_level: 2
    backbone:
      enc_depths: [1, 1, 1, 1, 1]
      enc_channels: [8, 12, 16, 24, 32]
      enc_num_head: [1, 1, 2, 4, 4]
      enc_patch_size: [4, 4, 4, 4, 4]
      shuffle_orders: false
      enable_flash: true

training:
  experiment_dir:
  run_name:
  resume: false
  overwrite: false
  num_gpus: 1
  seed: 42
  ray_storage_path: /mnt/ceph/users/ewulff/raytrain_results/
  train_split: train
  val_split: val
  batch_size: 8
  num_epochs: 2
  learning_rate: 0.0005
  weight_decay: 0.04
  final_weight_decay: 0.2
  clip_grad: 3.0
  max_train_batches:
  max_val_batches:
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true
  mixed_precision: bf16
  train_shuffle: true
  checkpoint_every_epochs: 1
  log_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  viz_every_n_steps: 10000
  log_backend: auto

diagnostics:
  detail_split: train[0:1]
  representation_split: train[:10]
  max_calo_hits: 256
  device: cuda
  seed: 7
  point_feature_sample_size: 2000
  top_k_prototypes: 8

download:
  dataset_types:
    - ttbar
  object_types:
    - calo_hits
  pu_config: pu0
  cache_dir: /mnt/ceph/users/ewulff/data/hf
  dataset_revision: e28a24cc9c1641a478ae4e5bc3b376eb624b7283
  num_proc: 4

smoke_test:
  train_split: train[:1]
  allow_synthetic_fallback: false
