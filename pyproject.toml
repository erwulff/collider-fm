[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collider-fm"
version = "0.1.0"
description = "Foundation models for particle collider data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "h5py",
    "huggingface_hub",
    "datasets",
    "pyarrow",
    "addict",
    "timm",
    "scipy",
    "ninja",
    "cumm==0.7.3",
    "spconv-cu126",
    "torch-scatter",
    "matplotlib",
    "tqdm",
    "comet-ml>=3.57.3",
    "omegaconf>=2.3.0",
    "flash-attn",
    "packaging",
    "ninja",
    "ray[train,tune]>=2.47",
    "scikit-learn>=1.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Match the existing cluster install flow, which builds torch-scatter from source.
find-links = ["https://data.pyg.org/whl/torch-2.8.0+cu128.html"]
no-binary-package = ["torch-scatter"]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["setuptools", "wheel", "torch"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "black",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "nbstripout>=0.9.1",
    "pre-commit>=4.5.1",
    "pytest",
]

[tool.black]
line-length = 160
target-version = ["py312"]
